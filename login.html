<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wanda - Login</title>
    <link rel="stylesheet" href="styles.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: var(--bg-main);
            font-family: 'Inter', sans-serif;
            background-image:
                radial-gradient(circle at top left, rgba(139, 92, 246, 0.12), transparent 40%),
                radial-gradient(circle at bottom right, rgba(217, 70, 239, 0.12), transparent 40%),
                radial-gradient(circle at center, rgba(16, 185, 129, 0.05), transparent 50%);
            background-attachment: fixed;
            color: var(--text-primary);
        }

        .login-container {
            background-color: var(--glass-bg);
            backdrop-filter: blur(12px);
            padding: 40px;
            border-radius: 16px;
            box-shadow: var(--shadow);
            width: 100%;
            max-width: 400px;
            text-align: center;
            border: 1px solid var(--border);
        }

        .login-container h2 {
            margin-top: 0;
            color: var(--text-primary);
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 24px;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 500;
        }

        .input-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background-color: rgba(0, 0, 0, 0.2);
            color: var(--text-primary);
            font-size: 16px;
            box-sizing: border-box;
            transition: var(--transition);
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(139, 92, 246, 0.2);
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: var(--accent-gradient);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.3);
        }

        .login-btn:hover {
            background: var(--accent-gradient-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(139, 92, 246, 0.4);
        }

        .login-btn:active {
            transform: scale(0.98);
        }

        .login-btn:disabled {
            background: var(--text-secondary);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .error-message {
            color: var(--alert);
            margin-bottom: 16px;
            font-size: 14px;
            display: none;
            background-color: rgba(239, 68, 68, 0.1);
            padding: 10px;
            border-radius: 6px;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        .logo {
            font-size: 56px;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 16px;
        }
    </style>
</head>

<body>

    <div class="login-container">
        <i class='bx bx-cube-alt logo'></i>
        <h2>Welcome Back</h2>

        <div id="error-message" class="error-message"></div>

        <div class="input-group">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="Enter your email" required>
        </div>

        <div class="input-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Enter your password" required>
        </div>

        <button id="submit-btn" class="login-btn" onclick="handleLogin()">Login to Dashboard</button>
    </div>

    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script>
        // Check if already logged in
        document.addEventListener("DOMContentLoaded", async () => {
            if (!window.supabaseClient) return;
            const { data: { session } } = await window.supabaseClient.auth.getSession();
            if (session) {
                window.location.href = 'index.html'; // Redirect to dashboard if logged in
            }
        });

        async function handleLogin() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('error-message');
            const submitBtn = document.getElementById('submit-btn');

            if (!email || !password) {
                errorMsg.textContent = 'Please enter both email and password.';
                errorMsg.style.display = 'block';
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerHTML = "<i class='bx bx-loader bx-spin'></i> Logging in...";
            errorMsg.style.display = 'none';

            try {
                const { data, error } = await window.supabaseClient.auth.signInWithPassword({
                    email: email,
                    password: password
                });

                if (error) throw error;

                // Login successful, redirect to dashboard
                window.location.href = 'index.html';

            } catch (error) {
                errorMsg.textContent = 'Login failed: ' + error.message;
                errorMsg.style.display = 'block';
                submitBtn.disabled = false;
                submitBtn.textContent = 'Login to Dashboard';
            }
        }
    </script>
</body>

</html>
